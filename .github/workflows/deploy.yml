name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/whenwhenwhenwhenwhen/when

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check required secrets
        env:
          CONVEX_SELF_HOSTED_URL: ${{ secrets.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          test -n "$CONVEX_SELF_HOSTED_URL"
          test -n "$CONVEX_SELF_HOSTED_ADMIN_KEY"
          test -n "$AUTH_GOOGLE_ID"
          test -n "$AUTH_GOOGLE_SECRET"
          test -n "$SITE_URL"

      # No version input: the pnpm version comes from the `packageManager`
      # field in package.json, so there is exactly one place to bump it.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs before anything is published or deployed, so a failure here leaves
      # production untouched rather than half-updated.
      - name: Test
        run: pnpm test

      - name: Build frontend
        run: pnpm run build

      - name: Set Convex environment variables
        env:
          CONVEX_SELF_HOSTED_URL: ${{ secrets.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_DEBOUNCE_MS: ${{ secrets.DISCORD_DEBOUNCE_MS }}
          DISCORD_NEW_MESSAGE_AFTER_MS: ${{ secrets.DISCORD_NEW_MESSAGE_AFTER_MS }}
        run: |
          pnpm exec convex env set AUTH_GOOGLE_ID "$AUTH_GOOGLE_ID"
          pnpm exec convex env set AUTH_GOOGLE_SECRET "$AUTH_GOOGLE_SECRET"
          pnpm exec convex env set SITE_URL "$SITE_URL"

          if [ -n "$DISCORD_APP_ID" ]; then
            pnpm exec convex env set DISCORD_APP_ID "$DISCORD_APP_ID"
          fi
          if [ -n "$DISCORD_BOT_TOKEN" ]; then
            pnpm exec convex env set DISCORD_BOT_TOKEN "$DISCORD_BOT_TOKEN"
          fi
          if [ -n "$DISCORD_PUBLIC_KEY" ]; then
            pnpm exec convex env set DISCORD_PUBLIC_KEY "$DISCORD_PUBLIC_KEY"
          fi
          if [ -n "$DISCORD_CLIENT_SECRET" ]; then
            pnpm exec convex env set DISCORD_CLIENT_SECRET "$DISCORD_CLIENT_SECRET"
          fi
          if [ -n "$DISCORD_DEBOUNCE_MS" ]; then
            pnpm exec convex env set DISCORD_DEBOUNCE_MS "$DISCORD_DEBOUNCE_MS"
          fi
          if [ -n "$DISCORD_NEW_MESSAGE_AFTER_MS" ]; then
            pnpm exec convex env set DISCORD_NEW_MESSAGE_AFTER_MS "$DISCORD_NEW_MESSAGE_AFTER_MS"
          fi

      - name: Deploy Convex
        env:
          CONVEX_SELF_HOSTED_URL: ${{ secrets.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
        run: pnpm exec convex deploy

      - name: Register Discord commands
        env:
          CONVEX_SELF_HOSTED_URL: ${{ secrets.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
        run: pnpm exec convex run discordSetup:registerCommands

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is a convenience alias; the per-commit tag and the digest
      # below are what deployment hosts should pin.
      - name: Build and publish Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest is the immutable name for what this run published. Hosts
      # pin it (and Renovate on the host side bumps it); the tags above are
      # only human-readable aliases for the same manifest.
      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Published image"
            echo
            echo '```'
            echo "${IMAGE_NAME}@${DIGEST}"
            echo "${IMAGE_NAME}:sha-${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
