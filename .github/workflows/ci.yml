name: CI

# `pull_request` covers Renovate's branches too, so dependency bumps are gated
# by the same checks as human changes. Both jobs are required status checks on
# main: GitHub auto-merge waits for them, so a green minor or patch bump lands
# on its own and a red one sits until someone looks.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version input: the pnpm version comes from the `packageManager`
      # field in package.json, so there is exactly one place to bump it.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails outright if a lockfile does not match its package.json, which is
      # the signal we want from a dependency PR rather than a silent re-resolve.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm exec vite build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    # The release build runs on Alpine, which the job above cannot speak for:
    # toolchains that ship prebuilt native binaries (TypeScript 7 among them)
    # can resolve to a glibc-only artifact and fail only here. This is also the
    # only check that exercises a Dockerfile base-image bump.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          # Read-only cache: a pull request token cannot reliably write to the
          # Actions cache, and a cache miss here is not worth failing over.
          cache-from: type=gha
