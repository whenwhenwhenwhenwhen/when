name: CI

# `pull_request` covers Dependabot's branches too, so dependency bumps are
# gated by the same checks as human changes. Dependabot runs with a read-only
# token and no access to repository secrets, so nothing here may depend on one.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails outright if a lockfile does not match its package.json, which is
      # the signal we want from a dependency PR rather than a silent re-resolve.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm exec vite build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    # The release build runs on Alpine, which the job above cannot speak for:
    # toolchains that ship prebuilt native binaries (TypeScript 7 among them)
    # can resolve to a glibc-only artifact and fail only here. This is also the
    # only check that exercises a Dockerfile base-image bump.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          # Read-only cache: a pull request token cannot reliably write to the
          # Actions cache, and a cache miss here is not worth failing over.
          cache-from: type=gha
