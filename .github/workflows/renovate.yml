name: Renovate

# Self-hosted Renovate runner. Repository policy lives in renovate.json5;
# this workflow only provides the schedule and credentials. PRs are opened as
# the clammet-renovate GitHub App, installed org-wide: the first step trades
# the app's client ID (variable RENOVATE_APP_CLIENT_ID) and private key (secret
# RENOVATE_APP_PRIVATE_KEY) for a short-lived installation token scoped to
# this repository. The app has write access to contents, issues, pull
# requests, statuses, and workflows (`workflows` because pinned actions mean
# Renovate edits files under .github/workflows). An app rather than
# GITHUB_TOKEN so the PRs it opens still trigger CI.

on:
  schedule:
    # Every six hours: often enough that a release, its aged-out
    # minimumReleaseAge window, and the automerge of the resulting green PR
    # all happen without anyone remembering to run something.
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Log what would happen without opening or merging anything
        type: boolean
        default: false

concurrency:
  group: renovate
  cancel-in-progress: false

# The default token stays read-only; everything that writes goes through
# the app's installation token.
permissions:
  actions: write
  contents: read

env:
  # Exact Renovate engine pin; the action's own default is the floating `44`
  # tag. Renovate bumps it weekly through the customManagers:githubActionsVersions
  # preset in the repo's Renovate config (the annotation must stay on the line
  # directly above the variable).
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  RENOVATE_VERSION: 44.35.4

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest

    steps:
      # GitHub disables cron triggers after 60 days without repository
      # activity. Re-enabling an active workflow resets that clock, so this
      # keeps every scheduled workflow alive while leaving manually disabled
      # ones alone.
      - name: Keep scheduled workflows alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --jq '.workflows[] | select(.state == "active" or .state == "disabled_inactivity") | .id' \
          | while read -r id; do
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/enable"
            done

      - name: Check required credentials
        env:
          RENOVATE_APP_CLIENT_ID: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          test -n "$RENOVATE_APP_CLIENT_ID"
          test -n "$RENOVATE_APP_PRIVATE_KEY"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mint installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      # GitHub's GraphQL API enforces an organisation's IP allow list against
      # GitHub App tokens even for that org's public repos (aquasecurity has
      # one), so the App token's github-tags lookup for aquasecurity/trivy-action
      # fails with "IP allow list enabled" and the action is never updated.
      # User tokens are not subject to it, so these host rules route only the
      # github.com datasource lookups through a scope-less classic PAT of the
      # yuzuyu-bot machine user (secret RENOVATE_GITHUB_LOOKUP_TOKEN; same
      # token in every repo of the fleet). The App token still does all
      # platform work (PRs, merges).
      - name: Route github.com datasource lookups through a user token
        env:
          LOOKUP_TOKEN: ${{ secrets.RENOVATE_GITHUB_LOOKUP_TOKEN }}
        run: |
          if [ -z "$LOOKUP_TOKEN" ]; then
            echo "::warning::RENOVATE_GITHUB_LOOKUP_TOKEN is not set; github-tags lookups for orgs with an IP allow list (aquasecurity/trivy-action) will fail"
            exit 0
          fi
          rules=$(jq -cn --arg t "$LOOKUP_TOKEN" \
            '["github-tags", "github-releases", "github-changelog"]
             | map({hostType: ., matchHost: "api.github.com", token: $t})')
          echo "RENOVATE_HOST_RULES=$rules" >> "$GITHUB_ENV"

      - name: Run Renovate
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Empty string disables dry-run; only the manual trigger can set it.
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
