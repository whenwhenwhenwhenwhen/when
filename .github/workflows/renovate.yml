name: Renovate


on:
  schedule:
    # Hourly; GitHub merges eligible PRs as soon as required checks pass.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Log what would happen without opening or merging anything
        type: boolean
        default: false

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  renovate:
    uses: yuzuyuzuyu/repo-automation/.github/workflows/renovate-runner.yml@5cc9087ea08575374c515afb0120292b9904a466 # v1.0.19
    with:
      app-client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
      native-automerge: true
      dry-run: ${{ inputs.dry-run || false }}
    secrets:
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      RENOVATE_GITHUB_LOOKUP_TOKEN: ${{ secrets.RENOVATE_GITHUB_LOOKUP_TOKEN }}
