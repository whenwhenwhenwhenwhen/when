version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    # Let a release age on the registry before adopting it. A version that is
    # unpublished, hot-patched, or pulled for a supply-chain issue is usually
    # caught within hours, and none of these updates are urgent enough to
    # justify being the first consumer.
    cooldown:
      default-days: 1
      semver-patch-days: 1
      semver-minor-days: 3
      semver-major-days: 7
    groups:
      react:
        patterns:
          - react
          - react-dom
          - react-router
      types:
        patterns:
          - "@types/*"
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - "@types/*"
          - typescript
    ignore:
      # TypeScript does not follow semver for type checking: a minor release can
      # legitimately introduce new errors in unchanged code. Majors are adopted
      # deliberately, with a real build, rather than by bot.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # @types/node majors track the Node.js major, which is pinned to the LTS
      # line (see the docker ignore below). The types move with the runtime,
      # not ahead of it.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 3
    ignore:
      # Node majors alternate between LTS (even) and short-lived current (odd)
      # lines, and Dependabot cannot tell them apart. Moving base image is a
      # deliberate choice tied to the LTS calendar, so patches and minors of the
      # pinned line are taken automatically and majors are not.
      - dependency-name: node
        update-types:
          - version-update:semver-major
